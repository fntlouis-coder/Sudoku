html{-webkit-text-size-adjust:100%}

body{margin:0}

<style>
/* Layout: une seule colonne centrée, grille au centre, pavé numérique dessous, commandes en bandeau. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14212b; --muted:#566673; --line:#c9d5dd;
  --box-line:#14212b; --accent:#0b6e8e; --accent-ink:#ffffff; --accent-soft:#d9edf4;
  --peer:#e7eef2; --same:#bfe0ec; --sel:#9fd2e4; --error:#b3261e; --error-soft:#f7d9d6; --ok:#1d7a46;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#18232b; --ink:#e6eef3; --muted:#93a5b1; --line:#2c3b45;
  --box-line:#8fa3b0; --accent:#5cc0e0; --accent-ink:#06222d; --accent-soft:#17323d;
  --peer:#1f2d36; --same:#1e4656; --sel:#27607a; --error:#ff8a80; --error-soft:#4a2320; --ok:#6fd49a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#18232b; --ink:#e6eef3; --muted:#93a5b1; --line:#2c3b45;
  --box-line:#8fa3b0; --accent:#5cc0e0; --accent-ink:#06222d; --accent-soft:#17323d;
  --peer:#1f2d36; --same:#1e4656; --sel:#27607a; --error:#ff8a80; --error-soft:#4a2320; --ok:#6fd49a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--line)}
.lv{border:0;background:transparent;border-radius:9px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.lv b{font-weight:600}
.lv small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.lv[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lv[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .label{font-weight:600;font-variant-numeric:tabular-nums;text-align:center;flex:1;min-width:0}
.nav .label span{color:var(--ok);margin-left:6px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px}
.ghost:hover{border-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1;background:var(--surface);
  border:2px solid var(--box-line);border-radius:6px;overflow:hidden;touch-action:manipulation}
.cell{position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);
  padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:clamp(18px,6.4vw,30px);
  font-weight:500;color:var(--accent);min-width:0;border-radius:0}
.cell.c2,.cell.c5{border-right:2px solid var(--box-line)}
.cell.c8{border-right:0}
.cell.r2,.cell.r5{border-bottom:2px solid var(--box-line)}
.cell.r8{border-bottom:0}
.cell.given{color:var(--ink);font-weight:700}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.bad{background:var(--error-soft);color:var(--error)}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;z-index:1}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  font-family:var(--font-body);font-size:clamp(8px,2.4vw,11px);font-weight:500;color:var(--muted);line-height:1}
.notes i{font-style:normal;display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.num{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0 5px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0}
.num b{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.1}
.num small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.num:hover:not(:disabled){border-color:var(--accent)}
.num:disabled{opacity:.35;cursor:default}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:500;min-width:0}
.tool:hover{border-color:var(--accent)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg{min-height:44px;border-radius:10px;padding:10px 12px;background:var(--accent-soft);color:var(--ink);font-weight:500}
.msg.win{background:var(--ok);color:var(--bg)}
.msg.err{background:var(--error-soft);color:var(--error)}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot .ghost{flex:1;min-width:140px}
.note-help{color:var(--muted);font-size:13px;margin:0}
/* ---- thèmes : chaque thème redéfinit tous les jetons de couleur ---- */
:root[data-skin="ocean"]{--bg:#0a1a2b;--surface:#112a42;--ink:#e4f1fb;--muted:#8fb0c8;--line:#24435f;--box-line:#7fb4d6;--accent:#4cc3ff;--accent-ink:#04243a;--accent-soft:#123a57;--peer:#163551;--same:#1d5578;--sel:#2a7199;--error:#ff8f85;--error-soft:#4d2325;--ok:#6fe0a6;color-scheme:dark}
:root[data-skin="foret"]{--bg:#e9f1e6;--surface:#fbfdf9;--ink:#1b2d1f;--muted:#546b58;--line:#c3d4c0;--box-line:#1b2d1f;--accent:#2f7d3b;--accent-ink:#ffffff;--accent-soft:#d5ead4;--peer:#e1ecde;--same:#bfdfbc;--sel:#9fd09b;--error:#b3261e;--error-soft:#f7d9d6;--ok:#1d7a46;color-scheme:light}
:root[data-skin="couchant"]{--bg:#1d1226;--surface:#2a1a38;--ink:#f6e9ee;--muted:#c4a4b8;--line:#4a3160;--box-line:#d9a5c0;--accent:#ff8a4c;--accent-ink:#2a1200;--accent-soft:#4a2c3f;--peer:#35213f;--same:#5a3350;--sel:#7a4358;--error:#ff9a90;--error-soft:#55222a;--ok:#8fe0a8;color-scheme:dark}
:root[data-skin="sakura"]{--bg:#faeef2;--surface:#fffafb;--ink:#3a1f2b;--muted:#8a5d70;--line:#ecc9d7;--box-line:#3a1f2b;--accent:#c2306a;--accent-ink:#ffffff;--accent-soft:#f7d6e2;--peer:#f6e3ea;--same:#f3bdd2;--sel:#eba0be;--error:#a8201a;--error-soft:#f9d7d2;--ok:#1d7a46;color-scheme:light}
:root[data-skin="minuit"]{--bg:#07070c;--surface:#11111a;--ink:#ececf6;--muted:#8a8aa3;--line:#26263a;--box-line:#7d7da8;--accent:#a98bff;--accent-ink:#140a30;--accent-soft:#231a44;--peer:#181826;--same:#2e2457;--sel:#3f3180;--error:#ff8a80;--error-soft:#45201f;--ok:#7fe0a6;color-scheme:dark}
:root[data-skin="encre"]{--bg:#efefef;--surface:#ffffff;--ink:#111111;--muted:#5c5c5c;--line:#d0d0d0;--box-line:#111111;--accent:#111111;--accent-ink:#ffffff;--accent-soft:#e2e2e2;--peer:#ececec;--same:#d4d4d4;--sel:#bdbdbd;--error:#b3261e;--error-soft:#f7d9d6;--ok:#1d7a46;color-scheme:light}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;flex:none}
.logo .bg{fill:var(--surface);stroke:var(--box-line);stroke-width:3}
.logo .thin{stroke:var(--line);stroke-width:1;fill:none}
.logo .thick{stroke:var(--box-line);stroke-width:2;fill:none}
.logo .o{fill:var(--accent)}
.logo .hl{fill:#ffffff;opacity:.45}
.logo text{fill:var(--accent-ink);font-family:var(--font-display);font-weight:700;font-size:14px;text-anchor:middle;dominant-baseline:central}
.tabs{grid-template-columns:repeat(2,1fr)}
.pane{display:flex;flex-direction:column;gap:16px}
.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.skin{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.skin[aria-pressed="true"]{border-color:var(--accent)}
.skin b{font-family:var(--font-display);font-weight:600}
.skin small{color:var(--muted)}
.sw{display:flex;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.sw i{flex:1}
.h2{font-family:var(--font-display);font-size:18px;font-weight:600;margin:0}
/* ---- fioles : réussite (verte) et erreur (rouge qui se brise) ---- */
.fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--ink);z-index:2}
.fx .fl{height:90%;width:auto;display:block;overflow:visible}
.fx-ok .fl{animation:flOk 1s ease both}
@keyframes flOk{0%{opacity:0;transform:translateY(8px) scale(.4)}22%{opacity:1;transform:translateY(0) scale(1.08)}38%{transform:scale(1)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-6px) scale(.7)}}
.fx .b{fill:#ffffff;opacity:0;transform-box:fill-box;transform-origin:center;animation:bub .9s linear infinite}
.fx .b2{animation-delay:.35s}
@keyframes bub{0%{transform:translateY(2px);opacity:.85}100%{transform:translateY(-7px);opacity:0}}
.fx-bad .fl{animation:flBad 1.5s ease both}
@keyframes flBad{0%{opacity:0;transform:translateY(8px) scale(.4)}12%{opacity:1;transform:scale(1.05)}18%{transform:scale(1)}22%{transform:rotate(-9deg)}28%{transform:rotate(9deg)}34%{transform:rotate(-7deg)}39%{opacity:1;transform:rotate(5deg) scale(1.05)}40%,100%{opacity:0;transform:scale(1.25)}}
.fx .sh{position:absolute;left:50%;top:58%;width:8px;height:8px;background:#ff5a4d;opacity:0;clip-path:polygon(50% 0,100% 100%,0 80%);animation:shard 1.5s ease-out both}
.fx .sh.g{background:currentColor}
@keyframes shard{0%,39%{opacity:0;transform:translate(-50%,-50%)}40%{opacity:.95;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r))}}
.fx .vp{position:absolute;left:50%;top:60%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,77,.65),rgba(255,90,77,0) 70%);filter:blur(2px);opacity:0;animation:vapor 1.5s ease-out both}
@keyframes vapor{0%,39%{opacity:0;transform:translate(-50%,-50%) scale(.4)}44%{opacity:.9}100%{opacity:0;transform:translate(calc(-50% + var(--vx)),calc(-50% - 38px)) scale(2.6)}}
.dg{display:inline-block;animation:dg .4s ease-out}
@keyframes dg{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.board.shake{animation:shake .55s ease-out}
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-5px,3px)}25%{transform:translate(5px,-4px)}40%{transform:translate(-4px,-3px)}55%{transform:translate(3px,4px)}70%{transform:translate(-2px,2px)}85%{transform:translate(1px,-1px)}}
@media (prefers-reduced-motion:reduce){.fx *,.dg{animation-duration:.01s!important}.board.shake{animation:none}}
@media (prefers-reduced-motion:no-preference){.cell,.num,.tool,.ghost,.lv{transition:background-color .12s,border-color .12s}}
</style>

<div class="app">
  <div class="top">

</div>

const LEVELS = [["facile","Facile"],["moyen","Moyen"],["difficile","Difficile"]];
const $ = id => document.getElementById(id);

// ---- stockage léger (peut être indisponible) ----
function sget(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function sset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let level = sget("sdk:level", "facile");
if(!DATA[level]) level = "facile";
let idx = 0, vals = [], notes = [], given = [], sol = [], sel = -1, notesMode = false;
let fx = {}, reveal = -1, elapsed = 0, won = false, hints = 0, timerId = null, flaskId = 0;
let done = sget("sdk:done", {facile:[], moyen:[], difficile:[]});
const saved = sget("sdk:idx", {}); // dernier numéro de grille par niveau

const cells = [];
function buildBoard(){
  const b = $("board");
  for(let i=0;i<81;i++){
    const r = Math.floor(i/9), c = i%9;
    const el = document.createElement("button");
    el.className = "cell c"+c+" r"+r;
    el.setAttribute("role","gridcell");
    el.addEventListener("click", () => select(i));
    b.appendChild(el); cells.push(el);
  }
  const pad = $("pad");
  for(let d=1; d<=9; d++){
    const n = document.createElement("button");
    n.className = "num"; n.id = "n"+d;
    n.innerHTML = "<b>"+d+"</b><small></small>";
    n.addEventListener("click", () => setDigit(d));
    pad.appendChild(n);
  }
}

function buildLevels(){
  const w = $("levels"); w.innerHTML = "";
  LEVELS.forEach(([k,name]) => {
    const b = document.createElement("button");
    b.className = "lv"; b.setAttribute("aria-pressed", String(k===level));
    b.innerHTML = "<b>"+name+"</b><small>"+done[k].length+"/100 résolues</small>";
    b.addEventListener("click", () => { if(k!==level){ save(); level = k; sset("sdk:level", k); load(saved[k] || 0); } });
    w.appendChild(b);
  });
}

function pkey(){ return "sdk:g:"+level+":"+idx; }
function save(){
  if(!vals.length) return;
  sset(pkey(), {v:vals.join(""), n:notes, t:elapsed, w:won, h:hints});
  saved[level] = idx; sset("sdk:idx", saved);
}

function load(i){
  idx = ((i % 100) + 100) % 100;
  const g = DATA[level][idx];
  given = g.p.split("").map(Number);
  sol = g.s.split("").map(Number);
  const s = sget(pkey(), null);
  if(s && s.v && s.v.length === 81){
    vals = s.v.split("").map(Number); notes = s.n && s.n.length === 81 ? s.n : Array(81).fill(0);
    elapsed = s.t || 0; won = !!s.w; hints = s.h || 0;
  } else {
    vals = given.slice(); notes = Array(81).fill(0); elapsed = 0; won = false; hints = 0;
  }
  vals = vals.map((v, i) => (given[i] || v === sol[i]) ? v : 0);
  fx = {}; reveal = -1; sel = -1;
  saved[level] = idx; sset("sdk:idx", saved);
  buildLevels(); render();
  say(won ? "Grille déjà résolue. Tu peux en choisir une autre." : "Choisis une case, puis un chiffre.", won ? "win" : "");
  startTimer();
}

function startTimer(){
  if(timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    if(won || document.hidden || tab !== "play") return;
    elapsed++; paintTimer();
    if(elapsed % 10 === 0) save();
  }, 1000);
}
function paintTimer(){
  const m = Math.floor(elapsed/60), s = elapsed%60;
  $("timer").textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "msg" + (cls ? " "+cls : ""); }

function peers(a, b){
  const ra = Math.floor(a/9), ca = a%9, rb = Math.floor(b/9), cb = b%9;
  return ra===rb || ca===cb || (Math.floor(ra/3)===Math.floor(rb/3) && Math.floor(ca/3)===Math.floor(cb/3));
}

function render(){
  const sv = sel >= 0 ? vals[sel] : 0;
  for(let i=0;i<81;i++){
    const el = cells[i], v = vals[i];
    let cls = "cell c"+(i%9)+" r"+Math.floor(i/9);
    if(given[i]) cls += " given";
    if(sel >= 0){
      if(i === sel) cls += " sel";
      else if(sv && v === sv) cls += " same";
      else if(peers(i, sel)) cls += " peer";
    }
    el.className = cls;
    if(fx[i]) continue;
    if(v){
      if(reveal === i) el.innerHTML = '<span class="dg">' + v + '</span>'; else el.textContent = v;
    } else if(notes[i]){
      let h = '<span class="notes">';
      for(let d=1; d<=9; d++) h += "<i>"+((notes[i] >> d) & 1 ? d : "")+"</i>";
      el.innerHTML = h + "</span>";
    } else {
      el.textContent = "";
    }
    el.setAttribute("aria-label", "Ligne "+(Math.floor(i/9)+1)+", colonne "+(i%9+1)+(v ? ", "+v : ", vide"));
  }
  for(let d=1; d<=9; d++){
    const n = vals.filter(x => x === d).length;
    const b = $("n"+d);
    b.querySelector("small").textContent = Math.max(0, 9-n);
    b.disabled = n >= 9;
  }
  $("notes").setAttribute("aria-pressed", String(notesMode));
  $("label").innerHTML = "Grille "+(idx+1)+" / 100"+(done[level].includes(idx) ? "<span>✓</span>" : "");
  paintTimer();
}

function select(i){ sel = i; render(); cells[i].focus({preventScroll:true}); }

const REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const T_OK = REDUCE ? 200 : 1000, T_BAD = REDUCE ? 250 : 1500;

function flaskSVG(ok, d){
  const id = "fc" + (++flaskId), col = ok ? "#3fd69a" : "#ff5a4d";
  return '<svg class="fl" viewBox="0 0 28 34" aria-hidden="true">'
    + '<defs><clipPath id="'+id+'"><circle cx="14" cy="22" r="10"/></clipPath></defs>'
    + '<rect x="10" y="3" width="8" height="11" fill="currentColor" fill-opacity=".1"/>'
    + '<circle cx="14" cy="22" r="10" fill="currentColor" fill-opacity=".1"/>'
    + '<g clip-path="url(#'+id+')"><rect x="2" y="19" width="24" height="16" fill="'+col+'"/>'
    + (ok ? '<circle class="b" cx="10" cy="28" r="1.4"/><circle class="b b2" cx="17" cy="29" r="1.1"/>' : '')
    + '</g>'
    + '<circle cx="14" cy="22" r="10" fill="none" stroke="currentColor" stroke-width="1.2"/>'
    + '<path d="M10 13V3M18 13V3M8.5 3H19.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>'
    + '<text x="14" y="26" text-anchor="middle" font-family="Space Grotesk,system-ui,sans-serif" font-weight="700" font-size="11" fill="#fff" stroke="rgba(0,0,0,.45)" stroke-width=".6" paint-order="stroke">'+d+'</text>'
    + '</svg>';
}

function startFx(i, ok, d){
  let h = '<span class="fx ' + (ok ? 'fx-ok' : 'fx-bad') + '">' + flaskSVG(ok, d);
  if(!ok){
    const sh = [[-17,-14,200,""],[16,-12,-150,"g"],[-12,12,120,""],[14,13,-210,"g"],[0,-20,90,""]];
    sh.forEach(a => { h += '<i class="sh '+a[3]+'" style="--dx:'+a[0]+'px;--dy:'+a[1]+'px;--r:'+a[2]+'deg"></i>'; });
    [-8,0,8].forEach((x, k) => { h += '<i class="vp" style="--vx:'+x+'px;animation-delay:'+(k*0.08)+'s"></i>'; });
  }
  cells[i].innerHTML = h + '</span>';
}

function place(i, d){
  if(d === sol[i]){
    vals[i] = d; notes[i] = 0;
    for(let j = 0; j < 81; j++) if(peers(j, i) && notes[j]) notes[j] &= ~(1 << d);
    fx[i] = "ok"; render(); startFx(i, true, d); save();
    say("Bien joué !");
    setTimeout(() => {
      delete fx[i]; reveal = i; render();
      setTimeout(() => { if(reveal === i){ reveal = -1; render(); } }, 450);
      if(vals.every((v, k) => v === sol[k])) win();
    }, T_OK);
  } else {
    fx[i] = "bad"; render(); startFx(i, false, d);
    say("Mauvais chiffre : la fiole s'est brisée.", "err");
    setTimeout(() => { delete fx[i]; render(); }, T_BAD);
  }
}

function setDigit(d){
  if(won) return;
  if(sel < 0){ say("Choisis d'abord une case."); return; }
  if(given[sel] || vals[sel]){ say("Cette case est déjà remplie."); return; }
  if(fx[sel]) return;
  if(notesMode){ notes[sel] ^= (1 << d); render(); save(); return; }
  place(sel, d);
}

function erase(){
  if(won || sel < 0 || given[sel] || vals[sel] || fx[sel]) return;
  notes[sel] = 0; render(); save();
}

function boom(){
  if(REDUCE) return;
  const W = window.innerWidth || 390, H = window.innerHeight || 800;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50";
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  document.body.appendChild(cv);
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const r = $("board").getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const cols = ["#3fd69a", "#4aa8ff", "#b27cff", "#ff5a4d", "#ffd34a"];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hex = (c, a) => { const n = parseInt(c.slice(1), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; };
  const parts = [];
  for(let i = 0; i < 28; i++){
    const a = rnd(0, Math.PI * 2);
    parts.push({t: "puff", a, sp: rnd(120, 380), size: rnd(46, 120), c: cols[i % cols.length], life: rnd(1.6, 2.6), delay: rnd(0, 0.18)});
  }
  for(let i = 0; i < 80; i++){
    const a = rnd(0, Math.PI * 2), sp = rnd(260, 760);
    parts.push({t: "spark", vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, c: i % 3 ? cols[i % cols.length] : "#ffffff", life: rnd(0.7, 1.5), delay: rnd(0, 0.1)});
  }
  for(let i = 0; i < 34; i++){
    parts.push({t: "bubble", x: ox + rnd(-r.width / 2, r.width / 2), y: oy + rnd(-r.height / 3, r.height / 2), vy: rnd(-200, -70), rad: rnd(3, 10), ph: rnd(0, 6), c: cols[i % cols.length], life: rnd(1.5, 2.6), delay: rnd(0.1, 0.7)});
  }
  const b = $("board");
  b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 600);
  const t0 = performance.now();
  function frame(now){
    const t = (now - t0) / 1000;
    g.clearRect(0, 0, W, H);
    if(t < 0.28){
      const a = 1 - t / 0.28, rad = Math.max(W, H) * (0.25 + t * 2.2);
      const gr = g.createRadialGradient(ox, oy, 0, ox, oy, rad);
      gr.addColorStop(0, "rgba(255,255,255," + (0.95 * a) + ")");
      gr.addColorStop(0.5, "rgba(255,240,200," + (0.5 * a) + ")");
      gr.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
    for(const p of parts){
      const age = t - p.delay;
      if(age < 0 || age > p.life) continue;
      const k = age / p.life;
      if(p.t === "puff"){
        const d = p.sp * (1 - Math.exp(-3 * age)) / 3;
        const x = ox + Math.cos(p.a) * d, y = oy + Math.sin(p.a) * d - 40 * age;
        const rad = p.size * (0.5 + k * 1.3);
        const gr = g.createRadialGradient(x, y, 0, x, y, rad);
        gr.addColorStop(0, hex(p.c, 0.6 * (1 - k)));
        gr.addColorStop(1, hex(p.c, 0));
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
      } else if(p.t === "spark"){
        const f = a_ => [ox + p.vx * a_, oy + p.vy * a_ + 450 * a_ * a_];
        const [x, y] = f(age), [x0, y0] = f(Math.max(0, age - 0.035));
        g.strokeStyle = p.c; g.globalAlpha = 1 - k; g.lineWidth = 2.2; g.lineCap = "round";
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x, y); g.stroke(); g.globalAlpha = 1;
      } else {
        const x = p.x + Math.sin(age * 6 + p.ph) * 7, y = p.y + p.vy * age;
        g.globalAlpha = 0.85 * (1 - k);
        g.fillStyle = hex(p.c, 0.25); g.strokeStyle = p.c; g.lineWidth = 1.6;
        g.beginPath(); g.arc(x, y, p.rad, 0, 7); g.fill(); g.stroke();
        g.fillStyle = "#ffffff"; g.beginPath(); g.arc(x - p.rad * 0.35, y - p.rad * 0.35, p.rad * 0.25, 0, 7); g.fill();
        g.globalAlpha = 1;
      }
    }
    if(t < 3.2) requestAnimationFrame(frame); else cv.remove();
  }
  requestAnimationFrame(frame);
}

function win(){
  won = true;
  if(!done[level].includes(idx)){ done[level].push(idx); sset("sdk:done", done); }
  buildLevels(); render(); save();
  const m = Math.floor(elapsed/60), s = elapsed%60;
  say("Réaction réussie ! Grille résolue en "+m+" min "+String(s).padStart(2,"0")+" s"+(hints ? " ("+hints+" indice"+(hints>1?"s":"")+")" : "")+".", "win");
  try{ boom(); }catch(e){}
}

function hint(){
  if(won) return;
  let t = -1;
  if(sel >= 0 && !given[sel] && !vals[sel] && !fx[sel]) t = sel;
  else {
    const empt = []; vals.forEach((v, i) => { if(!v && !fx[i]) empt.push(i); });
    if(empt.length) t = empt[Math.floor(Math.random() * empt.length)];
  }
  if(t < 0) return;
  hints++; sel = t;
  place(t, sol[t]);
  say("Indice : ligne " + (Math.floor(t/9)+1) + ", colonne " + (t%9+1) + ".");
}

function restart(){
  vals = given.slice(); notes = Array(81).fill(0); elapsed = 0; won = false; hints = 0; fx = {}; reveal = -1; sel = -1;
  render(); save(); say("Grille remise à zéro.");
}

$("notes").addEventListener("click", () => { notesMode = !notesMode; render(); say(notesMode ? "Mode notes activé : les chiffres s'écrivent en petit." : "Mode notes désactivé."); });

document.addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key >= "1" && e.key <= "9"){ setDigit(Number(e.key)); e.preventDefault(); }
  else if(e.key === "Backspace" || e.key === "Delete" || e.key === "0"){ erase(); e.preventDefault(); }
  else if(e.key === "n" || e.key === "N"){ notesMode = !notesMode; render(); }
  else if(e.key.startsWith("Arrow")){
    const s = sel < 0 ? 40 : sel; let r = Math.floor(s/9), c = s%9;
    if(e.key === "ArrowUp") r = Math.max(0, r-1);
    if(e.key === "ArrowDown") r = Math.min(8, r+1);
    if(e.key === "ArrowLeft") c = Math.max(0, c-1);
    if(e.key === "ArrowRight") c = Math.min(8, c+1);
    select(r*9+c); e.preventDefault();
  }
});
document.addEventListener("visibilitychange", () => { if(document.hidden) save(); });

  {id:"auto", name:"Auto", desc:"Suit ton téléphone", sw:["#eef2f5","#18232b","#0b6e8e"]},
  {id:"ocean", name:"Océan", desc:"Bleu nuit", sw:["#0a1a2b","#112a42","#4cc3ff"]},
  {id:"foret", name:"Forêt", desc:"Vert clair", sw:["#e9f1e6","#fbfdf9","#2f7d3b"]},
  {id:"couchant", name:"Couchant", desc:"Prune et orange", sw:["#1d1226","#2a1a38","#ff8a4c"]},
  {id:"sakura", name:"Sakura", desc:"Rose doux", sw:["#faeef2","#fffafb","#c2306a"]},
  {id:"minuit", name:"Minuit", desc:"Noir et violet", sw:["#07070c","#11111a","#a98bff"]},
  {id:"encre", name:"Encre", desc:"Noir et blanc", sw:["#efefef","#ffffff","#111111"]}
];
let skin = sget("sdk:skin", "auto");
if(!SKINS.some(s => s.id === skin)) skin = "auto";
let tab = "play";

function applySkin(){
  const r = document.documentElement;
  if(skin === "auto") r.removeAttribute("data-skin"); else r.setAttribute("data-skin", skin);
}
function buildSkins(){
  const w = $("skins"); w.innerHTML = "";
  SKINS.forEach(s => {
    const b = document.createElement("button");
    b.className = "skin"; b.setAttribute("aria-pressed", String(s.id === skin));
    b.innerHTML = '<div class="sw">'+s.sw.map(c => '<i style="background:'+c+'"></i>').join("")+'</div><b>'+s.name+'</b><small>'+s.desc+'</small>';
    b.addEventListener("click", () => { skin = s.id; sset("sdk:skin", skin); applySkin(); buildSkins(); });
    w.appendChild(b);
  });
}
function showTab(t){
  tab = t;
  $("play").hidden = t !== "play"; $("themes").hidden = t !== "themes";
  $("tabPlay").setAttribute("aria-pressed", String(t === "play"));
  $("tabThemes").setAttribute("aria-pressed", String(t === "themes"));
}
$("tabPlay").addEventListener("click", () => showTab("play"));
$("tabThemes").addEventListener("click", () => { save(); showTab("themes"); });

applySkin(); buildSkins();
buildBoard();
load(saved[level] || 0);
if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
